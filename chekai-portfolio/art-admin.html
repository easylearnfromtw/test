<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#f4f4f2">
<title>CHE-KAI ART CMS</title>
<style>
:root{--bg:#f4f4f2;--card:#fff;--ink:#0e1116;--muted:#74777d;--line:#d8d9dc;--accent:#111;--danger:#a82626;--ok:#16734a}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Noto Sans TC",sans-serif}
body{min-height:100dvh}.shell{max-width:1180px;margin:auto;padding:24px clamp(14px,3vw,32px) 80px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px}
.brand small{display:block;font:700 10px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;color:var(--muted)}
.brand h1{margin:7px 0 0;font-size:clamp(30px,5vw,56px);line-height:.92;letter-spacing:-.055em}
.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 13px;border-radius:12px;font-weight:750;cursor:pointer;text-decoration:none;font-size:13px}.btn:hover{border-color:#999}.btn.dark{background:#111;color:#fff;border-color:#111}.btn.danger{color:var(--danger)}
.grid{display:grid;grid-template-columns:minmax(0,390px) 1fr;gap:18px}.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 12px 30px rgba(0,0,0,.04)}
.panel h2{margin:0 0 16px;font-size:18px}.auth{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:12px}.field{display:grid;gap:6px;margin-bottom:13px}.field label{font-size:11px;font-weight:800;color:#4f5359;letter-spacing:.04em}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:#fafafa;border-radius:11px;padding:11px 12px;font:inherit;font-size:14px;outline:none}.field textarea{min-height:88px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:#555;background:#fff}
.note{font-size:11px;line-height:1.65;color:var(--muted)}.note code{font:inherit;color:#333}.status{min-height:20px;margin:10px 0 0;font-size:12px;color:var(--muted)}.status.ok{color:var(--ok)}.status.err{color:var(--danger)}
.uploadbox{position:relative;border:1.5px dashed #b9bbc0;border-radius:14px;padding:16px;background:#fafafa;text-align:center}.uploadbox input{position:absolute;inset:0;opacity:0;cursor:pointer}.preview{display:none;margin-top:10px;border-radius:12px;overflow:hidden;background:#eee}.preview img{display:block;width:100%;max-height:250px;object-fit:contain}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.check{display:flex;align-items:center;gap:8px;font-size:13px}.check input{width:18px;height:18px}
.listhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}.count{font:750 11px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted)}
.empty{padding:48px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}.cards{display:grid;gap:10px}.card{display:grid;grid-template-columns:110px 1fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:15px;padding:10px;background:#fff}.thumb{width:110px;aspect-ratio:4/3;border-radius:10px;overflow:hidden;background:#ececec}.thumb img{width:100%;height:100%;object-fit:cover;display:block}.meta b{display:block;font-size:14px}.meta span{display:block;margin-top:5px;font-size:11px;color:var(--muted);line-height:1.5}.pill{display:inline-flex!important;margin-top:7px!important;padding:4px 7px;border-radius:999px;background:#efefef;color:#555!important;font-size:9px!important;font-weight:800}.cardops{display:grid;grid-template-columns:1fr 1fr;gap:5px}.iconbtn{border:1px solid var(--line);background:#fafafa;border-radius:9px;padding:7px 8px;cursor:pointer;font-weight:800}.iconbtn:hover{background:#eee}.iconbtn.delete{color:var(--danger)}
@media(max-width:820px){.grid{grid-template-columns:1fr}.top{align-items:flex-end}.card{grid-template-columns:84px 1fr}.thumb{width:84px}.cardops{grid-column:1/-1;display:flex}.iconbtn{flex:1}.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="shell">
  <header class="top">
    <div class="brand"><small>CHE-KAI PORTFOLIO / PRIVATE CMS</small><h1>ART<br>ARCHIVE</h1></div>
    <div class="actions"><a class="btn" href="./index.html#art">查看前台 ↗</a><button class="btn" id="reloadBtn">重新整理</button></div>
  </header>
  <div class="grid">
    <section class="panel">
      <h2>新增／編輯作品</h2>
      <div class="field">
        <label>GitHub Fine-grained Token</label>
        <div class="auth"><input id="token" type="password" autocomplete="off" placeholder="github_pat_..."><button class="btn" id="saveToken" type="button">此分頁記住</button></div>
        <div class="note">Token 只存於這個瀏覽器分頁的 <code>sessionStorage</code>，不會寫進網站。權限只需要此 repo 的 <b>Contents: Read and write</b>。</div>
      </div>
      <input type="hidden" id="editingId">
      <div class="field"><label>作品名稱 *</label><input id="title" maxlength="80" placeholder="例如：城市速寫 01"></div>
      <div class="row">
        <div class="field"><label>分類</label><select id="category"><option>設計作品</option><option>手繪創作</option><option>攝影</option><option>其他</option></select></div>
        <div class="field"><label>年份</label><input id="year" inputmode="numeric" maxlength="4" placeholder="2026"></div>
      </div>
      <div class="field"><label>作品簡述</label><textarea id="description" maxlength="400" placeholder="媒材、概念、製作背景…"></textarea></div>
      <div class="field"><label>替代文字（無障礙）</label><input id="alt" maxlength="160" placeholder="簡單描述畫面內容"></div>
      <div class="field">
        <label>作品圖片 *</label>
        <div class="uploadbox" id="dropbox"><b>點擊或拖曳圖片到這裡</b><div class="note">JPG / PNG / WEBP；上傳時會自動壓成 WebP，最長邊約 2400px。</div><input id="file" type="file" accept="image/jpeg,image/png,image/webp"></div>
        <div class="preview" id="preview"><img id="previewImg" alt=""></div>
      </div>
      <label class="check"><input id="published" type="checkbox" checked> 前台公開展示</label>
      <div class="actions" style="margin-top:16px"><button class="btn dark" id="publishBtn" type="button">上傳並發布</button><button class="btn" id="cancelBtn" type="button" hidden>取消編輯</button></div>
      <div class="status" id="formStatus"></div>
    </section>

    <section class="panel">
      <div class="listhead"><h2 style="margin:0">作品管理</h2><span class="count" id="count">0 WORKS</span></div>
      <div class="empty" id="empty">尚未上傳作品。</div>
      <div class="cards" id="cards"></div>
      <div class="status" id="listStatus"></div>
    </section>
  </div>
</main>
<script>
const OWNER='easylearnfromtw',REPO='test',BRANCH='main',PREFIX='chekai-portfolio/';
const DATA_PATH=PREFIX+'data/artworks.json',ASSET_DIR=PREFIX+'assets/art/';
const API='https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/';
const els=Object.fromEntries(['token','saveToken','editingId','title','category','year','description','alt','file','preview','previewImg','published','publishBtn','cancelBtn','formStatus','cards','empty','count','listStatus','reloadBtn'].map(id=>[id,document.getElementById(id)]));
let state={version:1,updatedAt:'',items:[]},dataSha='',selectedFile=null,busy=false;
els.token.value=sessionStorage.getItem('ck_art_token')||'';
els.saveToken.onclick=()=>{sessionStorage.setItem('ck_art_token',els.token.value.trim());setStatus(els.formStatus,'Token 已暫存在此分頁。','ok')};
els.reloadBtn.onclick=()=>loadData(true);
els.file.onchange=()=>pickFile(els.file.files[0]);
els.cancelBtn.onclick=resetForm;
['dragenter','dragover'].forEach(ev=>document.getElementById('dropbox').addEventListener(ev,e=>{e.preventDefault()}));
document.getElementById('dropbox').addEventListener('drop',e=>{e.preventDefault();pickFile(e.dataTransfer.files[0])});
els.publishBtn.onclick=publish;
function token(){return els.token.value.trim()}
function headers(auth=true){const h={'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};if(auth&&token())h.Authorization='Bearer '+token();return h}
function setStatus(el,msg,type=''){el.textContent=msg;el.className='status '+type}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function bytesToBase64(bytes){let out='',chunk=0x8000;for(let i=0;i<bytes.length;i+=chunk)out+=String.fromCharCode(...bytes.subarray(i,Math.min(i+chunk,bytes.length)));return btoa(out)}
function utf8ToBase64(str){return bytesToBase64(new TextEncoder().encode(str))}
async function gh(path,opt={}){const r=await fetch(API+path,{...opt,headers:{...headers(opt.auth!==false),...(opt.headers||{})}});if(!r.ok){let m='GitHub API '+r.status;try{const j=await r.json();m=j.message||m}catch{}throw new Error(m)}return r.status===204?null:r.json()}
async function loadData(show=false){
  try{
    if(show)setStatus(els.listStatus,'同步中…');
    let j;
    if(token()){
      const r=await gh(DATA_PATH+'?ref='+BRANCH);
      dataSha=r.sha;j=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(r.content.replace(/\n/g,'')),c=>c.charCodeAt(0))));
    }else{
      const r=await fetch('./data/artworks.json?ts='+Date.now(),{cache:'no-store'});
      j=await r.json();dataSha='';
    }
    state=j&&Array.isArray(j.items)?j:{version:1,updatedAt:'',items:[]};
    render();
    if(show)setStatus(els.listStatus,'已同步 '+state.items.length+' 件作品。','ok');
  }catch(e){setStatus(els.listStatus,e.message,'err')}
}
function render(){
  els.count.textContent=state.items.length+' WORKS';
  els.empty.hidden=state.items.length>0;
  els.cards.innerHTML=state.items.map((x,i)=>`
    <article class="card" data-id="${esc(x.id)}">
      <div class="thumb"><img src="${esc(x.image)}?v=${encodeURIComponent(state.updatedAt||'1')}" alt="${esc(x.alt||x.title)}"></div>
      <div class="meta"><b>${esc(x.title)}</b><span>${esc(x.category||'未分類')} · ${esc(x.year||'—')}</span><span>${esc(x.description||'')}</span><span class="pill">${x.published===false?'未公開':'已公開'}</span></div>
      <div class="cardops">
        <button class="iconbtn" onclick="move('${esc(x.id)}',-1)" title="上移">↑</button>
        <button class="iconbtn" onclick="move('${esc(x.id)}',1)" title="下移">↓</button>
        <button class="iconbtn" onclick="editWork('${esc(x.id)}')">編輯</button>
        <button class="iconbtn delete" onclick="deleteWork('${esc(x.id)}')">刪除</button>
      </div>
    </article>`).join('');
}
function pickFile(file){
  if(!file)return;
  if(!/^image\/(jpeg|png|webp)$/.test(file.type)){setStatus(els.formStatus,'只接受 JPG / PNG / WEBP。','err');return}
  selectedFile=file;
  els.previewImg.src=URL.createObjectURL(file);els.preview.style.display='block';
}
async function compress(file){
  const url=URL.createObjectURL(file),img=new Image();
  await new Promise((ok,fail)=>{img.onload=ok;img.onerror=fail;img.src=url});
  const max=2400,scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
  const w=Math.max(1,Math.round(img.naturalWidth*scale)),h=Math.max(1,Math.round(img.naturalHeight*scale));
  const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d',{alpha:false}).drawImage(img,0,0,w,h);
  URL.revokeObjectURL(url);
  const blob=await new Promise(ok=>c.toBlob(ok,'image/webp',.88));
  if(!blob)throw new Error('圖片轉檔失敗');
  return {bytes:new Uint8Array(await blob.arrayBuffer()),w,h};
}
function slug(s){return (s||'art').toLowerCase().replace(/[^a-z0-9\u4e00-\u9fff]+/g,'-').replace(/^-|-$/g,'').slice(0,28)||'art'}
async function ensureAuth(){
  if(!token())throw new Error('請先輸入 GitHub Token。');
  sessionStorage.setItem('ck_art_token',token());
  const r=await gh(DATA_PATH+'?ref='+BRANCH);dataSha=r.sha;
  const raw=new TextDecoder().decode(Uint8Array.from(atob(r.content.replace(/\n/g,'')),c=>c.charCodeAt(0)));
  state=JSON.parse(raw);if(!Array.isArray(state.items))state.items=[];
}
async function saveData(message){
  state.updatedAt=new Date().toISOString();
  const body={message,content:utf8ToBase64(JSON.stringify(state,null,2)+'\n'),branch:BRANCH,sha:dataSha};
  const r=await gh(DATA_PATH,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  dataSha=r.content.sha;
}
async function publish(){
  if(busy)return;
  try{
    busy=true;els.publishBtn.disabled=true;setStatus(els.formStatus,'準備發布…');
    if(!els.title.value.trim())throw new Error('請輸入作品名稱。');
    await ensureAuth();
    const editId=els.editingId.value;
    const existing=state.items.find(x=>x.id===editId);
    let image=existing?.image||'',width=existing?.width||0,height=existing?.height||0;
    if(selectedFile){
      setStatus(els.formStatus,'圖片壓縮與上傳中…');
      const c=await compress(selectedFile);
      const id=existing?.id||((crypto.randomUUID?crypto.randomUUID():Date.now().toString(36))+'');
      const filename=Date.now()+'-'+slug(els.title.value)+'.webp';
      const path=ASSET_DIR+filename;
      await gh(path,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:'Upload art: '+els.title.value.trim(),content:bytesToBase64(c.bytes),branch:BRANCH})});
      image='./assets/art/'+filename;width=c.w;height=c.h;
      if(existing?.image)await tryDeleteAsset(existing.image);
    }
    if(!image)throw new Error('請選擇作品圖片。');
    const now=new Date().toISOString();
    const item={
      id:existing?.id||(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)),
      title:els.title.value.trim(),
      category:els.category.value,
      year:els.year.value.trim(),
      description:els.description.value.trim(),
      alt:els.alt.value.trim()||els.title.value.trim(),
      image,width,height,
      published:els.published.checked,
      createdAt:existing?.createdAt||now,
      updatedAt:now
    };
    if(existing){const i=state.items.findIndex(x=>x.id===existing.id);state.items[i]=item}else state.items.unshift(item);
    setStatus(els.formStatus,'更新作品索引…');
    await saveData(existing?'Update artwork: '+item.title:'Publish artwork: '+item.title);
    setStatus(els.formStatus,'已發布。GitHub Pages 通常會在 1–2 分鐘內更新。','ok');
    resetForm(false);render();
  }catch(e){setStatus(els.formStatus,e.message,'err')}
  finally{busy=false;els.publishBtn.disabled=false}
}
async function tryDeleteAsset(publicPath){
  const rel=publicPath.replace(/^\.\//,'');
  const path=PREFIX+rel;
  try{const info=await gh(path+'?ref='+BRANCH);await gh(path,{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:'Replace artwork image',sha:info.sha,branch:BRANCH})})}catch(e){console.warn(e)}
}
window.editWork=id=>{
  const x=state.items.find(y=>y.id===id);if(!x)return;
  els.editingId.value=x.id;els.title.value=x.title||'';els.category.value=x.category||'其他';els.year.value=x.year||'';els.description.value=x.description||'';els.alt.value=x.alt||'';els.published.checked=x.published!==false;selectedFile=null;
  els.previewImg.src=x.image+'?v='+encodeURIComponent(state.updatedAt||'1');els.preview.style.display='block';els.publishBtn.textContent='儲存修改';els.cancelBtn.hidden=false;scrollTo({top:0,behavior:'smooth'})
};
function resetForm(clearStatus=true){
  els.editingId.value='';els.title.value='';els.category.value='設計作品';els.year.value='';els.description.value='';els.alt.value='';els.file.value='';els.published.checked=true;selectedFile=null;els.preview.style.display='none';els.previewImg.removeAttribute('src');els.publishBtn.textContent='上傳並發布';els.cancelBtn.hidden=true;if(clearStatus)setStatus(els.formStatus,'')
}
els.cancelBtn.onclick=()=>resetForm();
window.move=async(id,dir)=>{
  if(busy)return;try{busy=true;await ensureAuth();const i=state.items.findIndex(x=>x.id===id),j=i+dir;if(i<0||j<0||j>=state.items.length)return;[state.items[i],state.items[j]]=[state.items[j],state.items[i]];await saveData('Reorder art archive');render();setStatus(els.listStatus,'排序已更新。','ok')}catch(e){setStatus(els.listStatus,e.message,'err')}finally{busy=false}
};
window.deleteWork=async id=>{
  if(busy)return;const x=state.items.find(y=>y.id===id);if(!x||!confirm('確定刪除「'+x.title+'」？\n圖片與前台資料都會移除。'))return;
  try{busy=true;await ensureAuth();const current=state.items.find(y=>y.id===id);if(!current)return;state.items=state.items.filter(y=>y.id!==id);await saveData('Delete artwork: '+current.title);await tryDeleteAsset(current.image);render();setStatus(els.listStatus,'已刪除 '+current.title+'。','ok')}catch(e){setStatus(els.listStatus,e.message,'err')}finally{busy=false}
};
loadData();
</script>
</body>
</html>
