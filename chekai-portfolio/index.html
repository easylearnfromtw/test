const LAP_MIN=-172.5,CHUNK=45;

function chunk(x){const ci=Math.floor((x-LAP_MIN)/CHUNK);let ch=world.chunks.get(ci);if(!ch){ch={};for(const k in LAYERS)ch[k]=new GeoBuf(!!LAYERS[k].world);world.chunks.set(ci,ch)}return ch}

function atlasQuadZ(buf,x0,y0,x1,y1,z,uvr,c=[1,1,1],dir=1){ // facing +z (dir=1) or -z
  if(dir>0)buf.quad([[x0,y0,z],[x1,y0,z],[x1,y1,z],[x0,y1,z]],[0,0,1],c,0,0,uvr);
  else buf.quad([[x1,y0,z],[x0,y0,z],[x0,y1,z],[x1,y1,z]],[0,0,-1],c,0,0,uvr)}

  if(dir>0)buf.quad([[x,y0,z1],[x,y0,z0],[x,y1,z0],[x,y1,z1]],[1,0,0],c,0,0,uvr);
  else buf.quad([[x,y0,z0],[x,y0,z1],[x,y1,z1],[x,y1,z0]],[-1,0,0],c,0,0,uvr)}
function finalizeWorld(){
  const mats={city:cityMat,grille:grilleMat,glass:glassTMat,decal:decalMat,sign:signMat,print:printMat,poster:posterMat};
  const order={city:0,grille:1,print:2,sign:3,poster:3,decal:5,glass:6};
  let tris=0;
  world.chunks.forEach((ch,ci)=>{
    for(const k in LAYERS){const geo=ch[k].geometry(LAYERS[k].uv);if(!geo)continue;tris+=geo.index.count/3;
      for(const copy of [-1,0,1]){const m=new THREE.Mesh(geo,mats[k]);m.position.x=copy*LOOP_SPAN;m.renderOrder=order[k];

        m.matrixAutoUpdate=false;m.updateMatrix();scene.add(m)}
      ch[k]=null}
  });
  world.chunks.clear();return tris
}

addEventListener('keydown',e=>{if(e.key==='Escape')drawer.classList.remove('open');if(e.key==='ArrowRight'||e.key==='PageDown')stepCycle(1);if(e.key==='ArrowLeft'||e.key==='PageUp')stepCycle(-1)});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;applyResponsiveCamera();
  QUALITY=qualityTargets();DPR_MIN=QUALITY.floor;DPR_MAX=QUALITY.idle;DPR_IDLE_TARGET=QUALITY.idle;
  renderDpr=QUALITY.idle;renderer.setPixelRatio(renderDpr);renderer.setSize(innerWidth,innerHeight)
});
let parallaxCorr=0;
// Seamless lap wrap: everything that moves in world space travels with the camera,
// and the distant-layer parallax jump is absorbed and eased out while the camera is in motion.
function shiftLap(d){
  currentX+=d;targetX+=d;
  cars.forEach(o=>o.g.position.x+=d);movingScooters.forEach(o=>o.x+=d);
  pedestrians.forEach(o=>{if(o.mode==='sidewalk')o.g.position.x+=d});
  mrtTrain.position.x+=d;if(mrtTrain.position.x>420)mrtTrain.position.x-=840;if(mrtTrain.position.x<-420)mrtTrain.position.x+=840;
  parallaxCorr+=.1*d;
}
function wrapLoop(){
  while(currentX>WRAP_RIGHT && targetX>WRAP_RIGHT)shiftLap(-LOOP_SPAN);
  while(currentX<WRAP_LEFT && targetX<WRAP_LEFT)shiftLap(LOOP_SPAN);
}
const CAMERA_SPEED=38;let lastFrameMs=performance.now(),elapsedTime=0;
let lastLightTick=-1,lastCullTick=-1,lastSecondaryTick=-1,lastSecondaryTime=0;
function moveToward(v,target,maxStep){const d=target-v;if(Math.abs(d)<=maxStep)return target;return v+Math.sign(d)*maxStep}
function animate(now=performance.now()){
  const dt=Math.min(.05,Math.max(0,(now-lastFrameMs)*.001));lastFrameMs=now;elapsedTime+=dt;const t=elapsedTime;
  currentX=moveToward(currentX,targetX,CAMERA_SPEED*dt);
  currentY=moveToward(currentY,targetY,7.5*dt);
  currentZ=moveToward(currentZ,targetZ,13*dt);
  wrapLoop();camera.position.set(currentX,currentY,currentZ);
  camera.rotation.set(Math.atan2(LOOK_AT_Y-currentY,currentZ-LOOK_AT_Z),0,0);
  const landmarkSpread=innerWidth<560?-6:innerWidth<920?4:14;
  // distant layers follow the camera at decreasing rates: gentle, believable parallax behind the street
  parallaxCorr*=Math.exp(-dt*.9);
  xinyiSkyline.position.x=currentX*.9+landmarkSpread+parallaxCorr;
  mountainFar.position.x=currentX*.97+parallaxCorr*.3;
  mountainNear.position.x=currentX*.95+parallaxCorr*.5;clouds.position.x=currentX*.985+Math.sin(t*.01)*40;
  updateSun(currentX);cityUniforms.uTime.value=t;skyUniforms.uTime.value=t;ledUniforms.uTime.value=t;
  oceanUniforms.uTime.value=t;
  ocean.position.x=currentX;
  oceanGlint.position.x=currentX+landmarkSpread*.18;
  oceanGlintMat.opacity=.055+.045*(.5+.5*Math.sin(t*.72));
  surfStrips.forEach((s,i)=>{
    const run=.5+.5*Math.sin(t*(1.05+i*.08)+s.phase);
    s.mesh.position.x=currentX;
    s.mesh.position.z=s.baseZ-run*(1.15+i*.20);
    s.mesh.material.opacity=.18+run*(.22-i*.025);
  });
  // Hysteresis culling: keeps GPU savings without rapid on/off popping at the boundary.
  const cullTick=Math.floor(t*5);
  if(cullTick!==lastCullTick){lastCullTick=cullTick;
    loopCullGroups.forEach(g=>{
      const dist=Math.abs(g.position.x-currentX);
      if(g.visible){if(dist>300)g.visible=false}
      else if(dist<260)g.visible=true;
    })
  }

  // No building or billboard luminance flicker. Traffic signals alone update at 4 Hz.
  const lightTick=Math.floor(t*4);
  if(lightTick!==lastLightTick){lastLightTick=lightTick;
    trafficSignals.forEach((s,i)=>{const q=(t+s.phase)%9;if(s.ped){const walk=q>=4&&q<8;s.mats[0].color.set(walk?0x401014:0xff3040);s.mats[1].color.set(walk?0x28e98b:0x0d3b27)}else{const active=q<4?2:q<5.2?1:0;s.mats.forEach((m,j)=>m.color.setHex(s.base[j]).multiplyScalar(j===active?1.5:.12))}})
  }
  const secondaryTick=Math.floor(t*60);
  if(secondaryTick!==lastSecondaryTick){
    const secondaryDt=Math.min(.034,Math.max(0,t-lastSecondaryTime));lastSecondaryTime=t;lastSecondaryTick=secondaryTick;
    barberPoles.forEach((p,i)=>p.rotation.y=t*(1.45+i*.05));
    pedestrians.forEach(o=>{
      if(o.mode==='cross'){const u=(Math.sin(t*.55+o.phase)+1)/2;o.g.position.z=-4+u*21;o.g.position.x=o.baseX+Math.sin(t*1.1+o.phase)*.38;o.g.rotation.y=Math.sin(t*.55+o.phase)>0?0:Math.PI}
      else if(o.mode==='sidewalk'){o.g.position.x+=o.dir*o.speed*secondaryDt;if(o.g.position.x>520)o.g.position.x=-520;if(o.g.position.x<-520)o.g.position.x=520;o.g.position.z=o.baseZ+Math.sin(t*.7+o.phase)*.10;o.g.rotation.y=o.dir>0?Math.PI/2:-Math.PI/2}
      else{o.g.position.z=o.baseZ;o.g.position.x=o.baseX+Math.sin(t*.55+o.phase)*.08}
    });
  }
  cars.forEach((o,i)=>{
    o.g.position.x+=o.dir*o.speed*dt;
    let rel=o.g.position.x-currentX;
    const span=360;
    while(rel>span*.5){o.g.position.x-=span;rel-=span}
    while(rel<-span*.5){o.g.position.x+=span;rel+=span}
  });
  mrtTrain.position.x+=8.4*dt;
  if(mrtTrain.position.x>420)mrtTrain.position.x=-420;
  updateScooters(dt,t);
  // Fixed 2K-class framebuffer: no runtime reallocations or resolution drops.
  renderer.render(scene,camera);requestAnimationFrame(animate)
}requestAnimationFrame(animate);
const initial=location.hash.slice(1);
if(initial&&initial!=='hero'&&DATA[initial]){introDismissed=true;intro?.classList.add('hidden');focus(initial,false)}
else{focus('hero',false)}
