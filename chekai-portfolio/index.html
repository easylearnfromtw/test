  {id:'writing',el:'b-writing',model:'x 625 / y -90 / z -90'},
  {id:'roles',el:'b-roles',model:'x 410 / y 305 / z 95'},
  {id:'public',el:'b-public',model:'x 725 / y 300 / z 5'},
  {id:'art',el:'b-art',model:'x 890 / y 430 / z -120'}
];

const scene=document.getElementById('scene'),viewport=document.getElementById('viewport'),drawer=document.getElementById('drawer');
const drawerTitle=document.getElementById('drawerTitle'),drawerIntro=document.getElementById('drawerIntro'),drawerList=document.getElementById('drawerList'),drawerKicker=document.getElementById('drawerKicker');
const topnav=document.getElementById('topnav'),focusLabel=document.getElementById('focusLabel'),fill=document.getElementById('fill');

function boardHTML(d){
  const list=d.items.slice(0,d.type==='hero'?3:4).map(x=>`<li>${x[0]}</li>`).join('');
  if(d.type==='hero') return `<div class="billboard hero-board" data-open="hero"><div><div class="bb-title">CHE-KAI<br>LIN</div><div class="bb-sub">WRITER / DESIGNER / STUDENT</div></div><span class="bb-arrow">→</span></div>`;
  return `<div class="billboard ${['web','experience','running'].includes(Object.keys(DATA).find(k=>DATA[k]===d))?'dark':''}" data-open="${Object.keys(DATA).find(k=>DATA[k]===d)}"><div class="bb-index">${d.index}</div><h2 class="bb-title">${d.title}</h2><ul class="bb-list">${list}</ul><span class="bb-arrow">→</span></div>`;
}

function buildCity(){
  BUILDINGS.forEach((b,i)=>{
    const d=DATA[b.id];
    const el=document.createElement('section');el.className='building';el.id=b.el;el.dataset.section=b.id;el.dataset.model=b.model;
    el.innerHTML=`<div class="building-body"><div class="roof"></div>${i%3===0?'<div class="antenna"></div>':''}${boardHTML(d)}<div class="side-sign">${d.title}</div><div class="small-board">${b.id==='hero'?'<b>EXPLORE</b> / LEARN / CREATE / CONNECT':'CHE-KAI LIN · '+d.nav}</div></div>`;
    scene.appendChild(el);
  });
  ['about'].forEach(id=>{
    const d=DATA[id],el=document.createElement('section');el.className='building';el.id='b-about';el.dataset.section=id;el.dataset.model='x -145 / y 40 / z 245';
    el.style.cssText='--x:-145px;--y:40px;--z:245px;--w:290px;--h:350px;--ry:0deg';
    el.innerHTML=`<div class="building-body">${boardHTML(d)}<div class="small-board"><b>WHO AM I?</b> · PERSONAL PROFILE</div></div>`;scene.appendChild(el)
  });
}

function buildNav(){
  ['hero','about','web','experience','academic','writing','running','roles','public','art'].forEach((id,i)=>{
    const b=document.createElement('button');b.textContent=DATA[id].nav;b.dataset.target=id;if(i===0)b.classList.add('active');b.onclick=()=>focus(id,true);topnav.appendChild(b)
  })
}

function openDrawer(id){
  const d=DATA[id];drawerKicker.textContent=`${d.index} / ${d.nav}`;drawerTitle.textContent=d.title;drawerIntro.textContent=d.intro;drawerList.innerHTML=d.items.map(x=>`<div class="drawer-item"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('');drawer.classList.add('open')
}
document.getElementById('drawerClose').onclick=()=>drawer.classList.remove('open');

let cam={yaw:0,pitch:-2,zoom:0.88,ty:40,targetYaw:0,targetPitch:-2,targetZoom:.88,targetTy:40,drag:false,x:0,y:0,focused:'hero'};
const FOCUS={hero:{yaw:0,pitch:-2,zoom:.88,ty:40},about:{yaw:0,pitch:-1,zoom:1.15,ty:65},web:{yaw:13,pitch:-2,zoom:1.02,ty:60},experience:{yaw:16,pitch:-5,zoom:1.02,ty:-20},running:{yaw:9,pitch:-8,zoom:1.12,ty:-80},academic:{yaw:-10,pitch:-2,zoom:1.03,ty:55},writing:{yaw:-15,pitch:-2,zoom:1.02,ty:55},roles:{yaw:-9,pitch:-8,zoom:1.10,ty:-72},public:{yaw:-16,pitch:-8,zoom:1.09,ty:-75},art:{yaw:-20,pitch:-10,zoom:1.18,ty:-120}};
function focus(id,showDrawer=false){
  const p=FOCUS[id]||FOCUS.hero;cam.targetYaw=p.yaw;cam.targetPitch=p.pitch;cam.targetZoom=p.zoom;cam.targetTy=p.ty;cam.focused=id;focusLabel.textContent=DATA[id].nav.toUpperCase();
  document.querySelectorAll('.building').forEach(x=>x.classList.toggle('focused',x.dataset.section===id));document.querySelectorAll('.topnav button').forEach(x=>x.classList.toggle('active',x.dataset.target===id));
  const order=['hero','about','web','experience','academic','writing','running','roles','public','art'],idx=Math.max(0,order.indexOf(id));fill.style.width=((idx/(order.length-1))*100)+'%';history.replaceState(null,'','#'+id);if(showDrawer)openDrawer(id)
}

function render(){
  cam.yaw+=(cam.targetYaw-cam.yaw)*.08;cam.pitch+=(cam.targetPitch-cam.pitch)*.08;cam.zoom+=(cam.targetZoom-cam.zoom)*.08;cam.ty+=(cam.targetTy-cam.ty)*.08;
  const mobile=innerWidth<700;const baseScale=mobile?.67:innerWidth<1050?.78:1;
  scene.style.transform=`translate3d(0,${cam.ty}px,0) rotateX(${cam.pitch}deg) rotateY(${cam.yaw}deg) scale(${cam.zoom*baseScale})`;
  requestAnimationFrame(render)
}

viewport.addEventListener('pointerdown',e=>{if(e.target.closest('.billboard,.topbar,.drawer,button'))return;cam.drag=true;cam.x=e.clientX;cam.y=e.clientY;viewport.classList.add('dragging');viewport.setPointerCapture?.(e.pointerId)});
viewport.addEventListener('pointermove',e=>{if(!cam.drag)return;const dx=e.clientX-cam.x,dy=e.clientY-cam.y;cam.targetYaw+=dx*.055;cam.targetPitch-=dy*.035;cam.targetYaw=Math.max(-28,Math.min(28,cam.targetYaw));cam.targetPitch=Math.max(-15,Math.min(9,cam.targetPitch));cam.x=e.clientX;cam.y=e.clientY});
function stop(){cam.drag=false;viewport.classList.remove('dragging')}viewport.addEventListener('pointerup',stop);viewport.addEventListener('pointercancel',stop);
viewport.addEventListener('wheel',e=>{cam.targetZoom-=e.deltaY*.00055;cam.targetZoom=Math.max(.68,Math.min(1.35,cam.targetZoom));e.preventDefault()},{passive:false});
viewport.addEventListener('mousemove',e=>{if(cam.drag||innerWidth<900)return;const nx=(e.clientX/innerWidth-.5),ny=(e.clientY/innerHeight-.5);scene.style.setProperty('--mx',nx);scene.style.setProperty('--my',ny)});

document.addEventListener('click',e=>{const bb=e.target.closest('.billboard');if(!bb)return;const id=bb.dataset.open;focus(id,true)});
const modelBtn=document.getElementById('modelBtn');modelBtn.onclick=()=>{document.body.classList.toggle('model');modelBtn.classList.toggle('active')};
addEventListener('keydown',e=>{if(e.key==='Escape'){drawer.classList.remove('open');focus('hero',false)}if(e.key==='m'||e.key==='M')modelBtn.click()});

buildCity();buildNav();
const initial=location.hash.slice(1);focus(DATA[initial]?initial:'hero',false);requestAnimationFrame(render);
</script>
</body>
</html>
