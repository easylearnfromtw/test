async function loadCitymus(){
  try{

      fetch('https://raw.githubusercontent.com/easylearnfromtw/musictown/main/verified_audio_manifest.json',{cache:'force-cache'}),
      fetch('https://raw.githubusercontent.com/easylearnfromtw/musictown/main/remote-audio-map.js',{cache:'force-cache'})

  }catch(e){cityPlaylist=[]}
  if(!cityPlaylist.length)cityPlaylist=CITYMUS_FALLBACK;
  cityTrackIndex=Math.floor(Math.random()*cityPlaylist.length);playCityTrack(cityTrackIndex)
}

canvas.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY};moved=false;dragging=true;canvas.classList.add('dragging');canvas.setPointerCapture?.(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!dragging){if(e.pointerType==='mouse'){pointerN(e);ray.setFromCamera(mouse,camera);document.body.style.cursor=ray.intersectObjects(clickables,false).length?'pointer':''}return}if(Math.abs(e.clientX-down.x)+Math.abs(e.clientY-down.y)>8)moved=true});
canvas.addEventListener('pointerup',e=>{dragging=false;canvas.classList.remove('dragging');const dx=e.clientX-down.x,dy=e.clientY-down.y;if(moved&&Math.abs(dx)>Math.max(46,Math.abs(dy)*1.1)){stepCycle(dx>0?-1:1);return}if(!moved){pointerN(e);ray.setFromCamera(mouse,camera);const hit=ray.intersectObjects(clickables,false)[0];if(hit)focus(hit.object.userData.section,true)}});canvas.addEventListener('pointercancel',()=>{dragging=false;canvas.classList.remove('dragging')});
canvas.addEventListener('wheel',e=>{if(e.ctrlKey||e.metaKey){targetZ+=e.deltaY*.02;targetZ=Math.max(28,Math.min(52,targetZ))}else if(!wheelLock&&Math.abs(e.deltaY)+Math.abs(e.deltaX)>12){wheelLock=true;const d=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;stepCycle(d>0?1:-1);setTimeout(()=>wheelLock=false,320)}e.preventDefault()},{passive:false});
document.getElementById('next')?.addEventListener('click',()=>stepCycle(1));document.getElementById('prev')?.addEventListener('click',()=>stepCycle(-1));
document.getElementById('plus')?.addEventListener('click',()=>targetZ=Math.max(28,targetZ-2.5));document.getElementById('minus')?.addEventListener('click',()=>targetZ=Math.min(52,targetZ+2.5));document.getElementById('reset')?.addEventListener('click',()=>{drawer.classList.remove('open');focus('hero',false)});
addEventListener('keydown',e=>{if(e.key==='Escape'){drawer.classList.remove('open');focus('hero',false)}if(e.key==='ArrowRight'||e.key==='PageDown')stepCycle(1);if(e.key==='ArrowLeft'||e.key==='PageUp')stepCycle(-1)});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;applyResponsiveCamera();renderer.setSize(innerWidth,innerHeight);renderDpr=Math.min(renderDpr,DPR_MAX,devicePixelRatio);renderer.setPixelRatio(renderDpr)});
function wrapLoop(){
  while(currentX>WRAP_RIGHT && targetX>WRAP_RIGHT){ currentX-=LOOP_SPAN; targetX-=LOOP_SPAN; }
  while(currentX<WRAP_LEFT && targetX<WRAP_LEFT){ currentX+=LOOP_SPAN; targetX+=LOOP_SPAN; }
}
const clock=new THREE.Clock(),CAMERA_SPEED=38;
let lastLightTick=-1,fpsFrames=0,fpsTime=0;
function moveToward(v,target,maxStep){const d=target-v;if(Math.abs(d)<=maxStep)return target;return v+Math.sign(d)*maxStep}
function animate(){
  const dt=Math.min(.05,clock.getDelta()),t=clock.elapsedTime;
  currentX=moveToward(currentX,targetX,CAMERA_SPEED*dt);
  currentY=moveToward(currentY,targetY,7.5*dt);
  currentZ=moveToward(currentZ,targetZ,13*dt);
  wrapLoop();camera.position.set(currentX,currentY,currentZ);camera.lookAt(currentX,LOOK_AT_Y,LOOK_AT_Z);
  const openingHero=buildings.get('hero:0');
  if(openingHero&&openingHeroRetired&&openingHero.visible){
    const dx=Math.abs(currentX-CONFIG.hero.x);
    // Keep it alive during the departure so it physically slides off-screen.
    // Once comfortably outside the view, remove it forever from the loop.
    if(dx>48)openingHero.visible=false;
  }

  // signage flicker at ~12 Hz instead of touching dozens of materials every frame
  const lightTick=Math.floor(t*12);
  if(lightTick!==lastLightTick){lastLightTick=lightTick;
    flicker.forEach((m,i)=>{const s=.82+.18*(.5+.5*Math.sin(t*(1.05+(i%3)*.13)+m.userData.phase));m.color.copy(m.userData.base).multiplyScalar(s);m.opacity=.78+.14*(.5+.5*Math.sin(t*.82+m.userData.phase))});
    lightboxes.forEach((o,i)=>{const phase=o.phase??o.mat?.userData.phase??i*.77,wave=.86+.14*(.5+.5*Math.sin(t*(1.0+(i%5)*.07)+phase)),blink=Math.sin(t*5.3+i*2.37)>.996?.45:1;if(o.mat)o.mat.emissiveIntensity=(o.mat.userData.baseIntensity||1.35)*wave*blink;if(o.halo)o.halo.opacity=.07+.09*wave*blink})
    trafficSignals.forEach((s,i)=>{const q=(t+s.phase)%9,active=q<4?2:q<5.2?1:0;s.mats.forEach((m,j)=>m.emissiveIntensity=j===active?2.5:.05)})
  }
  barberPoles.forEach((p,i)=>p.rotation.y=t*(1.45+i*.05));
  cars.forEach(o=>{o.g.position.x+=o.dir*o.speed*dt;if(o.g.position.x>510)o.g.position.x=-510;if(o.g.position.x<-510)o.g.position.x=510});
  pedestrians.forEach(o=>{
    if(o.mode==='cross'){const u=(Math.sin(t*.55+o.phase)+1)/2;o.g.position.z=-4+u*21;o.g.position.x=o.baseX+Math.sin(t*1.1+o.phase)*.38;o.g.rotation.y=Math.sin(t*.55+o.phase)>0?0:Math.PI}
    else if(o.mode==='sidewalk'){o.g.position.x+=o.dir*o.speed*dt;if(o.g.position.x>520)o.g.position.x=-520;if(o.g.position.x<-520)o.g.position.x=520;o.g.position.z=o.baseZ+Math.sin(t*.7+o.phase)*.10;o.g.rotation.y=o.dir>0?Math.PI/2:-Math.PI/2}
    else{o.g.position.z=o.baseZ;o.g.position.x=o.baseX+Math.sin(t*.55+o.phase)*.08}
  });

  // Motion prioritizes fps; once the camera settles, recover high-DPI text/detail.
  const cameraMoving=Math.abs(targetX-currentX)>.035||Math.abs(targetY-currentY)>.025||Math.abs(targetZ-currentZ)>.035;
  fpsFrames++;fpsTime+=dt;
  if(fpsTime>=1.6){
    const fps=fpsFrames/fpsTime;let next=renderDpr;
    if(cameraMoving){
      if(fps<50)next=Math.max(DPR_MIN,renderDpr-.08);
      else if(fps>58)next=Math.min(DPR_MAX,devicePixelRatio,renderDpr+.035);
    }else{
      // stationary portfolio panels should look like print, not a low-res game frame
      if(fps>43)next=Math.min(DPR_IDLE_TARGET,renderDpr+.18);
      else if(fps<38)next=Math.max(MOBILE_GPU?1.05:1.10,renderDpr-.05);
    }
    if(Math.abs(next-renderDpr)>.015){renderDpr=next;renderer.setPixelRatio(renderDpr)}
    fpsFrames=0;fpsTime=0
  }
  renderer.render(scene,camera);requestAnimationFrame(animate)
}animate();
const initial=location.hash.slice(1);if(DATA[initial]){if(initial!=='hero')openingHeroRetired=true;focus(initial,false)}
</script>
