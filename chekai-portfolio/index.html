<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#07131f" />
<title>CHE-KAI LIN — 3D Personal City</title>
<meta name="description" content="Che-Kai Lin 林哲愷 — Writer X Designer X Student. Interactive 3D portfolio city." />
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="ui">
  <header class="topbar">
    <div class="brand">CHE-KAI LIN <small>WRITER × DESIGNER × STUDENT</small></div>
    <div class="mantra"><span>IDEAS</span><span>PEOPLE</span><span>PROJECTS</span><span>IMPACT</span></div>
    <div class="controls"><button class="ui-btn" id="modelBtn">MODEL MODE</button><button class="ui-btn" id="resetBtn">RESET VIEW</button></div>
  </header>
  <nav class="rail" id="rail" aria-label="Portfolio sections"></nav>
  <div class="hint"><b>DRAG</b> to rotate · <b>WHEEL</b> to zoom · <i>CLICK BILLBOARD</i> to open</div>
  <div class="status"><span class="dot"></span><span>Focus</span><strong id="focusLabel">Central Plaza</strong></div>
</div>
<div class="viewport" id="viewport">
  <div class="skyline"></div>
  <div class="camera" id="camera"><div class="city" id="city"><div class="ground"></div><div class="avenue"></div><div class="plaza"></div><div id="buildings"></div></div></div>
</div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <button class="drawer-close" id="drawerClose" aria-label="Close">×</button>
  <div class="drawer-no" id="drawerNo">01</div><h2 id="drawerTitle">ABOUT</h2><p class="lede" id="drawerLede"></p><div class="detail-list" id="drawerList"></div><div class="drawer-footer">CHE-KAI LIN · PERSONAL CITY · EDITION 2026</div>
</aside>
<script src="app.js"></script>
</body>
</html>
